name: Front end - test and deploy

# Runs the tests and the build when anything in frontend/ changes. On a push to main, if they pass, the built site
# is copied to the server. Nothing is built on the server, and it holds no GitHub token.
# The site calls the API at /api on its own address, so no API address is compiled in.

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  workflow_dispatch: # also lets you run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: deploy-kuccps-web
  cancel-in-progress: false # never stop a deploy halfway

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build # type-checks, then builds into dist/
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: frontend/dist
          retention-days: 7

  deploy:
    needs: check # a failing check stops the deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Uploads first and removes old files last (--delete-after), so the live site is never half-empty.
      - name: Copy the site to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete-after \
            -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/kuccps/dist/"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
