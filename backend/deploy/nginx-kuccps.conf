# Install as /etc/nginx/sites-available/kuccps and link it into sites-enabled (see docs/deploy.md).
# Serves the built web app and passes /api/ to the API. certbot adds the HTTPS block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name kuccps.epicbizintel.com;

    root /var/www/kuccps/dist;
    index index.html;

    # A class of 300 learners is a few tens of kilobytes; anything much bigger is not a mark sheet.
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8013;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API counts each visitor by the last address in this header (NUM_PROXIES = 1), so it must be appended
        # here, not passed through from the visitor.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built files have a hash in their name, so they can be kept for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is the single-page app; the page itself must never be cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
